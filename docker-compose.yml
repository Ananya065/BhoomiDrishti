version: "3.9"

services:
  backend:
    build: ./backend
    container_name: bhoomidrishti-backend
    ports:
      - "8000:8000"
    volumes:
      - backend_data:/app
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: bhoomidrishti-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend_data:
